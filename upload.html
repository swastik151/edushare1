```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduShare - Upload</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="uploads-header">
        <h1>📚 EduShare</h1>
        <p>Share helpful study materials with your class</p>
    </header>

    <main class="upload-page">

        <div class="upload-card">

            <div class="upload-title">
                <div class="upload-icon">📤</div>

                <h2>Upload Study Material</h2>

                <p>
                    Add notes, diagrams, worksheets, or other helpful
                    study materials.
                </p>
            </div>

            <!-- SUBJECT -->
            <div class="form-group">

                <label for="subject">
                    📚 Choose a subject
                </label>

                <select id="subject">
                    <option value="">Select a subject</option>
                    <option value="Mathematics">📐 Mathematics</option>
                    <option value="Science">🔬 Science</option>
                    <option value="English">📖 English</option>
                    <option value="Social Science">🌍 Social Science</option>
                    <option value="Computer">💻 Computer</option>
                </select>

            </div>

            <!-- FILE -->
            <div class="form-group">

                <label>
                    📎 Choose your material
                </label>

                <label for="imageInput" class="file-drop">

                    <span class="file-icon">📄</span>

                    <strong>Click to choose a file</strong>

                    <small>
                        Images, notes and study materials
                    </small>

                </label>

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                >

            </div>

            <!-- PREVIEW -->
            <div class="preview-area">

                <img
                    id="preview"
                    style="display:none;"
                    alt="Selected material preview"
                >

            </div>

            <!-- UPLOAD BUTTON -->
            <button id="uploadBtn" class="main-upload-button">
                ⬆️ Upload Material
            </button>

            <!-- STATUS -->
            <p id="status" class="upload-status"></p>

            <a href="uploads.html" class="back-link">
                ← View shared materials
            </a>

        </div>

    </main>

    <script type="module" src="js/upload.js"></script>

</body>

</html>
```
