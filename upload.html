<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduShare - Upload</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>EduShare</h1>
    <p>Upload Study Material</p>
</header>

<main>

    <h2>Upload Picture</h2>

    <input type="file" id="imageInput" accept="image/*">

    <br><br>

    <button id="uploadBtn">
        Upload Picture
    </button>

    <p id="status"></p>

    <br>

    <img
        id="preview"
        style="display:none; max-width:500px; border-radius:12px;"
    >

</main>

<script type="module" src="js/upload.js"></script>

</body>

</html>
