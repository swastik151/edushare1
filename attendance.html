<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduShare - Attendance</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .attendance-container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .attendance-card {
            background: rgba(10, 25, 55, 0.95);
            border: 1px solid #2563eb;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(37, 99, 235, 0.25);
        }

        .attendance-card h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .today {
            text-align: center;
            margin-bottom: 25px;
            opacity: 0.8;
        }

        .add-student {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .add-student input {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #2563eb;
            font-size: 16px;
        }

        .add-student button {
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .student {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            margin: 10px 0;
            background: rgba(255,255,255,0.06);
            border-radius: 12px;
        }

        .student-name {
            font-weight: bold;
            font-size: 17px;
        }

        .status-buttons {
            display: flex;
            gap: 8px;
        }

        .status-buttons button {
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .present {
            background: #16a34a;
        }

        .absent {
            background: #dc2626;
        }

        .selected {
            box-shadow: 0 0 0 3px white;
        }

        #studentList {
            margin-top: 10px;
        }

        .empty {
            text-align: center;
            padding: 30px;
            opacity: 0.7;
        }

        @media (max-width: 600px) {
            .student {
                flex-direction: column;
                gap: 12px;
                align-items: stretch;
            }

            .status-buttons button {
                flex: 1;
            }

            .add-student {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>EduShare</h1>
    <p>Attendance System</p>
</header>

<div class="attendance-container">

    <div class="attendance-card">

        <h2>📋 Today's Attendance</h2>

        <div class="today" id="today"></div>

        <div class="add-student">
            <input
                type="text"
                id="studentName"
                placeholder="Enter student name"
            >

            <button id="addStudent">
                ➕ Add Student
            </button>
        </div>

        <div id="studentList">
            <div class="empty">
                Loading students...
            </div>
        </div>

    </div>

</div>

<script type="module" src="js/attendance.js"></script>

</body>
</html>
