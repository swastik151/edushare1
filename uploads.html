<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduShare - Uploads</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="uploads-header">
        <h1>EduShare</h1>
        <p>Study materials shared by your class</p>
    </header>

    <main class="uploads-page">

        <div class="uploads-top">
            <div>
                <h2>📚 Shared Materials</h2>
                <p>Choose a subject to view its study materials.</p>
            </div>

            <a href="upload.html" class="upload-button">
                + Upload
            </a>
        </div>

        <!-- SUBJECT BUTTONS -->
        <div id="subjectButtons" class="subject-buttons"></div>

        <!-- UPLOADS -->
        <div id="uploadsContainer" class="uploads-grid"></div>

    </main>

    <script type="module" src="js/uploads.js"></script>

</body>

</html>
